  .bn-sb{ pointer-events:auto; box-sizing:border-box; display:flex; align-items:center; gap:9px; margin:8px 14px 0; padding:9px 12px 9px 14px; border-radius:12px; font-size:12.5px; font-weight:500; color:var(--fg); background:var(--card); border:1px solid var(--border); max-height:0; margin-top:0; padding-top:0; padding-bottom:0; overflow:hidden; opacity:0; transition:max-height .26s cubic-bezier(.22,.61,.36,1), opacity .18s ease, margin .26s cubic-bezier(.22,.61,.36,1), padding .26s cubic-bezier(.22,.61,.36,1); }

<div ref="{{ rootRef }}" class="pc-root bn-root" data-theme="light" data-color="Warm paper" style="position:relative; width:100%; height:100%; pointer-events:none; font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif;">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900},&quot;connection&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Online&quot;,&quot;options&quot;:[&quot;Online&quot;,&quot;Offline&quot;,&quot;Server unreachable&quot;,&quot;Restored&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Connection state&quot;},&quot;bannerDemo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;None&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;All tones&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Sample banners&quot;},&quot;colorScheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Warm paper&quot;,&quot;options&quot;:[&quot;Warm paper&quot;,&quot;Fern &amp; ink&quot;,&quot;Fern &amp; ochre&quot;,&quot;Fern library&quot;,&quot;Oat &amp; ink&quot;,&quot;Terracotta dusk&quot;,&quot;Sage library&quot;,&quot;Slate archive&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;,&quot;label&quot;:&quot;Color scheme&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() {
    const root = this.rootRef.current; if (!root) return;
    root.setAttribute('data-color', this.props.colorScheme || 'Warm paper');
    this._connT = [];
    document.addEventListener('kl-banner', this._evShow = e => this.show((e && e.detail) || {}));
    document.addEventListener('kl-banner-hide', this._evHide = e => this.hide(((e && e.detail) || {}).key));
    this.applyConn(this.props.connection || 'Online', true);
    this.applyDemo(this.props.bannerDemo || 'None');
    // standalone preview with default props: show the sample set
    if (!document.querySelector('.pg[data-pg]') && (this.props.bannerDemo || 'None') === 'None' && (this.props.connection || 'Online') === 'Online') {
      setTimeout(() => this.applyDemo('All tones'), 300);
    }
  }
  componentWillUnmount() {
    document.removeEventListener('kl-banner', this._evShow);
    document.removeEventListener('kl-banner-hide', this._evHide);
    this.clearConnTimers();
  }
  componentDidUpdate(prev) {
    const root = this.rootRef.current; if (!root) return;
    if (prev.colorScheme !== this.props.colorScheme) root.setAttribute('data-color', this.props.colorScheme || 'Warm paper');
    if (prev.connection !== this.props.connection) this.applyConn(this.props.connection || 'Online');
    if (prev.bannerDemo !== this.props.bannerDemo) this.applyDemo(this.props.bannerDemo || 'None');
  }
  icon(name) {
    const P = {
      info: '<circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.6h.01"></path>',
      warn: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path>',
      error: '<circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5h.01"></path>',
      ok: '<circle cx="12" cy="12" r="9"></circle><path d="M8.3 12.5l2.6 2.6 5-5.6"></path>',
      wifiOff: '<path d="M2 2l20 20"></path><path d="M8.6 16.5a5 5 0 0 1 6-.6"></path><path d="M5 12.7a10 10 0 0 1 3.4-2.2"></path><path d="M14.6 8.5a10 10 0 0 1 4.4 2.4"></path><path d="M12 20h.01"></path>',
      cloudOff: '<path d="M2 2l20 20"></path><path d="M6.8 6.9A5.5 5.5 0 0 0 7.5 17.5h9"></path><path d="M10.6 4.6A6 6 0 0 1 18 10.5a4 4 0 0 1 2.5 6.9"></path>'
    };
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none; display:block;">' + (P[name] || P.info) + '</svg>';
  }
  spin() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none; display:block; animation:bnSpin .9s linear infinite;"><path d="M21 12a9 9 0 1 1-6.2-8.56"></path></svg>';
  }
  col() { const r = this.rootRef.current; return r && r.querySelector('.bn-col'); }
  strip() { const r = this.rootRef.current; return r && r.querySelector('.bn-strip'); }
  // the shell insets its pages by the strip's height so the strip never overlaps a control
  stripInset() {
    const st = this.strip(); if (!st) return;
    const h = st.offsetHeight;
    if (this._inset === h) return;
    this._inset = h;
    try { document.dispatchEvent(new CustomEvent('kl-banner-inset', { detail: { h: h } })); } catch (e) {}
  }
  // o: {key, tone: notice|warning|error|success, msg (html), icon, spin, action, onAction, ttl, onDismiss}
  show(o) {
    if (o && o.sticky) return this.showStrip(o);
    const col = this.col(); if (!col || !o) return;
    const key = o.key || ('bn' + (this._n = (this._n || 0) + 1));
    let p = col.querySelector('.bn-pill[data-key="' + key + '"]');
    const fresh = !p;
    if (fresh) {
      p = document.createElement('div');
      p.className = 'bn-pill';
      p.setAttribute('data-key', key);
      p.setAttribute('role', 'status');
      col.prepend(p);
    }
    if (p._ttl) { clearTimeout(p._ttl); p._ttl = null; }
    p.setAttribute('data-tone', o.tone || 'notice');
    p.removeAttribute('data-out');
    const icoName = o.icon || ({ notice: 'info', warning: 'warn', error: 'error', success: 'ok' })[o.tone || 'notice'];
    let h = '<span class="bn-ico" style="display:flex; flex:none;">' + (o.spin ? this.spin() : this.icon(icoName)) + '</span>';
    h += '<span class="bn-msg" style="min-width:0; overflow:hidden; text-overflow:ellipsis;">' + (o.msg || '') + '</span>';
    if (o.action) h += '<span style="color:var(--dot-sep); flex:none;"></span><button class="bn-a">' + o.action + '</button>';
    h += '<button class="bn-x" aria-label="Dismiss"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>';
    p.innerHTML = h;
    p.querySelector('.bn-x').addEventListener('click', () => { this.hide(key); if (key === 'conn') this.clearConnTimers(); if (o.onDismiss) o.onDismiss(); });
    const a = p.querySelector('.bn-a');
    if (a && o.onAction) a.addEventListener('click', o.onAction);
    if (o.ttl) p._ttl = setTimeout(() => this.hide(key), o.ttl);
    if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => p.setAttribute('data-in', '1')));
    else p.setAttribute('data-in', '1');
    const live = col.querySelectorAll('.bn-pill:not([data-out="1"])');
    if (live.length > 4) this.hide(live[live.length - 1].getAttribute('data-key'));
    return p;
  }
  // one strip banner at a time — persistent state is singular by definition
  showStrip(o) {
    const st = this.strip(); if (!st || !o) return;
    const key = o.key || 'sticky';
    let p = st.querySelector('.bn-sb[data-key="' + key + '"]');
    const fresh = !p;
    if (fresh) { st.innerHTML = ''; p = document.createElement('div'); p.className = 'bn-sb'; p.setAttribute('data-key', key); p.setAttribute('role', 'status'); st.appendChild(p); }
    if (p._ttl) { clearTimeout(p._ttl); p._ttl = null; }
    p.setAttribute('data-tone', o.tone || 'notice');
    const icoName = o.icon || ({ notice: 'info', warning: 'warn', error: 'error', success: 'ok' })[o.tone || 'notice'];
    let h = '<span class="bn-ico" style="display:flex; flex:none;">' + (o.spin ? this.spin() : this.icon(icoName)) + '</span>';
    h += '<span class="bn-msg" style="min-width:0; overflow:hidden; text-overflow:ellipsis;">' + (o.msg || '') + '</span>';
    if (o.action) h += '<span style="color:var(--dot-sep); flex:none;"></span><button class="bn-a">' + o.action + '</button>';
    h += '<span style="flex:1;"></span>';
    if (o.dismissible !== false) h += '<button class="bn-x" aria-label="Dismiss"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>';
    p.innerHTML = h;
    const x = p.querySelector('.bn-x');
    if (x) x.addEventListener('click', () => { this.hide(key); if (key === 'conn') this.clearConnTimers(); if (o.onDismiss) o.onDismiss(); });
    const a = p.querySelector('.bn-a');
    if (a && o.onAction) a.addEventListener('click', o.onAction);
    if (o.ttl) p._ttl = setTimeout(() => this.hide(key), o.ttl);
    requestAnimationFrame(() => { p.setAttribute('data-in', '1'); setTimeout(() => this.stripInset(), 30); });
    return p;
  }
  hide(key) {
    const st = this.strip();
    const sp = st && key && st.querySelector('.bn-sb[data-key="' + key + '"]');
    if (sp) {
      if (sp._ttl) clearTimeout(sp._ttl);
      sp.removeAttribute('data-in');
      setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); this.stripInset(); }, 300);
      this.stripInset();
      return;
    }
    const col = this.col(); if (!col || !key) return;
    const p = col.querySelector('.bn-pill[data-key="' + key + '"]');
    if (!p) return;
    if (p._ttl) clearTimeout(p._ttl);
    p.setAttribute('data-out', '1');
    setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 280);
  }
  clearConnTimers() { (this._connT || []).forEach(t => { clearTimeout(t); clearInterval(t); }); this._connT = []; }
  applyConn(v, initial) {
    this.clearConnTimers();
    if (v !== 'Server unreachable') this._back = null;
    if (v === 'Online') { if (!initial) this.hide('conn'); return; }
    if (v === 'Offline') {
      this.show({ key: 'conn', sticky: true, tone: 'warning', icon: 'wifiOff', msg: 'You\u2019re offline: showing the last synced data.' });
      return;
    }
    if (v === 'Restored') {
      this.show({ key: 'conn', sticky: true, tone: 'success', msg: 'Connection restored: data resynced.', ttl: 4000 });
      return;
    }
    this.connCountdown(5);
  }
  connCountdown(n) {
    let sec = n;
    this.show({
      key: 'conn', sticky: true, tone: 'error', icon: 'cloudOff',
      msg: 'Server unreachable: retrying in <span class="bn-cd">' + sec + 's</span>. Your data is safe.',
      action: 'Retry now',
      onAction: () => { this.clearConnTimers(); this.connProbe(); }
    });
    const iv = setInterval(() => {
      sec--;
      if (sec <= 0) { clearInterval(iv); this.connProbe(); return; }
      const r = this.rootRef.current; const cd = r && r.querySelector('[data-key="conn"] .bn-cd');
      if (cd) cd.textContent = sec + 's';
    }, 1000);
    this._connT.push(iv);
  }
  connProbe() {
    this.show({ key: 'conn', sticky: true, tone: 'error', spin: 1, msg: 'Server unreachable: checking\u2026' });
    const t = setTimeout(() => {
      if ((this.props.connection || 'Online') !== 'Server unreachable') return;
      this._back = Math.min(12, (this._back || 5) + 3);
      this.connCountdown(this._back);
    }, 1100);
    this._connT.push(t);
  }
  applyDemo(v) {
    if (v === 'All tones') {
      this.show({ key: 'demo-notice', tone: 'notice', msg: 'A new version of OmniKnowledge is available.', action: 'Refresh' });
      this.show({ key: 'demo-warning', tone: 'warning', icon: 'wifiOff', msg: 'You\u2019re offline: showing the last synced data.' });
      this.show({ key: 'demo-error', tone: 'error', icon: 'cloudOff', msg: 'Server unreachable: retrying in <span class="bn-cd">5s</span>. Your data is safe.', action: 'Retry now' });
      this.show({ key: 'demo-success', tone: 'success', msg: 'Connection restored: data resynced.' });
    } else {
      ['demo-notice', 'demo-warning', 'demo-error', 'demo-success'].forEach(k => this.hide(k));
    }
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
