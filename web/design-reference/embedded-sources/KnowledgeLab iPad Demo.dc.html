<script>
window.addEventListener('error', function(e){ try { console.error('[trace]', e.message, '|', e.filename||'?', '|', e.lineno+':'+e.colno, '|', e.error && (e.error.stack || e.error.message) || 'no-err-obj'); } catch(_){} }, true);
window.addEventListener('unhandledrejection', function(e){ try { console.error('[trace-rej]', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)); } catch(_){} });
// bundle-toast-guard: hide the bundler's toast ONLY for the masked, detail-free
// "Script error." (opaque-origin inlining artifact, zero impact — see ipad-demo-audit.md
// P2-14). Real errors, which carry details, still toast and still hit the trace hooks.
new MutationObserver(function(ms){ ms.forEach(function(m){ if (!m.addedNodes) return; for (var i=0;i<m.addedNodes.length;i++){ var n=m.addedNodes[i]; if (n && n.nodeType===1 && /^\[bundle\]\s*Script error\.?$/.test((n.textContent||'').trim())) n.style.display='none'; } }); }).observe(document.documentElement, {childList:true, subtree:true});
</script>

  html, body { height:100%; margin:0; background:#ece5d8; }

<script type="text/x-dc" data-dc-script data-props="{&quot;pipelineStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Flow chart (6d)&quot;,&quot;options&quot;:[&quot;Panel (default)&quot;,&quot;Flow chart (6d)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;,&quot;label&quot;:&quot;Build pipeline&quot;},&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Fill the window&quot;,&quot;options&quot;:[&quot;Fill the window&quot;,&quot;Desktop 1600 × 900&quot;,&quot;MacBook Air 15 1440 × 932&quot;,&quot;MacBook Air 13 1280 × 832&quot;,&quot;iPad 12.9 1366 × 1024&quot;,&quot;iPad 11 1194 × 834&quot;,&quot;iPad 9.7 1024 × 768&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Viewport&quot;,&quot;label&quot;:&quot;Frame size&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Build&quot;,&quot;options&quot;:[&quot;Login&quot;,&quot;Home&quot;,&quot;Build&quot;,&quot;Runs&quot;,&quot;Explore&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;,&quot;label&quot;:&quot;Active page&quot;},&quot;buildState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Has results&quot;,&quot;options&quot;:[&quot;Before first run&quot;,&quot;Has results&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;,&quot;label&quot;:&quot;Build page state&quot;},&quot;seedCardStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Compact cards&quot;,&quot;options&quot;:[&quot;Compact cards&quot;,&quot;List rows&quot;,&quot;Cover tiles&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page state&quot;,&quot;label&quot;:&quot;Seed card style&quot;},&quot;runState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Running&quot;,&quot;options&quot;:[&quot;Before first run&quot;,&quot;Idle with history&quot;,&quot;Running&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;,&quot;label&quot;:&quot;Runs page state&quot;},&quot;exploreState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Has results&quot;,&quot;options&quot;:[&quot;Before first run&quot;,&quot;Has results&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;,&quot;label&quot;:&quot;Explore page state&quot;},&quot;connection&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Online&quot;,&quot;options&quot;:[&quot;Online&quot;,&quot;Offline&quot;,&quot;Server unreachable&quot;,&quot;Restored&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Resilience&quot;,&quot;label&quot;:&quot;Connection state&quot;},&quot;apiRetries&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Resilience&quot;,&quot;label&quot;:&quot;Sustained API failure&quot;},&quot;keyProbe&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;All valid&quot;,&quot;options&quot;:[&quot;All valid&quot;,&quot;Invalid Gemini key&quot;,&quot;Rate-limited S2&quot;,&quot;OpenAI unreachable&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Resilience&quot;,&quot;label&quot;:&quot;Key verification result&quot;},&quot;networkPalette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Neutral ink&quot;,&quot;options&quot;:[&quot;Neutral ink&quot;,&quot;Accent ink&quot;,&quot;Ochre → slate&quot;,&quot;Slate ink&quot;,&quot;Teal depth&quot;,&quot;Moss&quot;,&quot;Purple dusk&quot;,&quot;Rose clay&quot;,&quot;Gold ember&quot;,&quot;Teal → rose&quot;,&quot;Blue dawn&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;,&quot;label&quot;:&quot;Network year palette&quot;},&quot;homeState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Has projects&quot;,&quot;options&quot;:[&quot;Has projects&quot;,&quot;First visit&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Home&quot;,&quot;label&quot;:&quot;Home state&quot;},&quot;libraryLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Side by side&quot;,&quot;options&quot;:[&quot;Side by side&quot;,&quot;Tabs&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Home&quot;,&quot;label&quot;:&quot;Library placement&quot;},&quot;projectRows&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Preview cards&quot;,&quot;options&quot;:[&quot;Preview cards&quot;,&quot;Plain rows&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Home&quot;,&quot;label&quot;:&quot;Project rows&quot;},&quot;collectionStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Cover rows&quot;,&quot;options&quot;:[&quot;Cover rows&quot;,&quot;Mini tiles&quot;,&quot;Playlist cards&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Home&quot;,&quot;label&quot;:&quot;Collection style&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  _ov = {};
  componentDidMount() {
    // the status strip is chrome: it lands under the top bar and the pages inset their content by its height
    this._bnInset = e => { const r = this.rootRef.current; if (r) r.style.setProperty('--bn-inset', ((e.detail && e.detail.h) || 0) + 'px'); };
    document.addEventListener('kl-banner-inset', this._bnInset);
    const root = this.rootRef.current;
    if (!root) return;
    this.show(this.props.page || 'Build', true);
    this.syncTheme();
    root.addEventListener('kl-open-filters', () => this.show('Build'));
    root.addEventListener('kl-login', () => this.show('Home'));
    root.addEventListener('kl-home', () => this.show('Home'));
    root.addEventListener('kl-open-project', e => { this._buildOv = (e.detail && e.detail.fresh) ? 'Before first run' : null; this.forceUpdate(); this.show('Build'); });
    root.addEventListener('kl-logout', () => this.logout());
    root.addEventListener('click', e => {
      const tab = e.target.closest && e.target.closest('.tb-tab');
      if (!tab || !root.contains(tab)) return;
      const name = (tab.textContent || '').trim();
      if (name === 'Build' || name === 'Runs' || name === 'Explore') this.show(name);
    });
    // five quick taps on the logo tile open the hidden demo-state switcher
    this._taps = [];
    root.addEventListener('pointerdown', e => {
      if (!(e.target.closest && e.target.closest('.tb-mark'))) return;
      const now = Date.now();
      this._taps = this._taps.filter(t => now - t < 2500).concat(now);
      if (this._taps.length >= 5) { this._taps = []; this.dswOpen(true); }
    });
    const dsw = root.querySelector('.dsw');
    if (dsw) dsw.addEventListener('click', e => {
      if (e.target === dsw) { this.dswOpen(false); return; }
      const b = e.target.closest && e.target.closest('.dsw-b');
      if (b && b.parentNode.dataset.k) { this._ov[b.parentNode.dataset.k] = b.dataset.v; this.forceUpdate(); this.dswPaint(); return; }
      if (e.target.closest('.dsw-reset')) { this.dswReset(); return; }
      if (e.target.closest('.dsw-x, .dsw-done')) this.dswOpen(false);
    });
    // landscape only: portrait (or any frame under ~1160) gets the rotate invite
    const rot = () => root.setAttribute('data-rot', root.clientWidth < 1160 ? '1' : '0');
    this._rotRO = new ResizeObserver(rot);
    this._rotRO.observe(root);
    rot();
  }
  dswOpen(on) {
    const el = this.rootRef.current && this.rootRef.current.querySelector('.dsw');
    if (!el) return;
    el.setAttribute('data-open', on ? '1' : '0');
    if (on) this.dswPaint();
  }
  dswPaint() {
    const root = this.rootRef.current; if (!root) return;
    const cur = {
      build: this._ov.build ?? this._buildOv ?? (this.props.buildState ?? 'Has results'),
      run: this._ov.run ?? (this.props.runState ?? 'Running'),
      explore: this._ov.explore ?? (this.props.exploreState ?? 'Has results'),
    };
    root.querySelectorAll('.dsw-seg').forEach(seg => {
      seg.querySelectorAll('.dsw-b').forEach(b => b.setAttribute('data-on', b.dataset.v === cur[seg.dataset.k] ? '1' : '0'));
    });
  }
  dswReset() {
    this._ov = {}; this._buildOv = null;
    this.forceUpdate();
    this.dswPaint();
    this.dswOpen(false);
    this.show('Build');
  }
  componentDidUpdate(prev) {
    if (prev.page !== this.props.page) this.show(this.props.page || 'Build');
    if (prev.buildState !== this.props.buildState) this._buildOv = null;
  }
  syncTheme() {
    const root = this.rootRef.current;
    if (!root) return;
    const seen = new WeakSet();
    const attach = () => {
      root.querySelectorAll('.pc-root').forEach(el => {
        if (seen.has(el)) return;
        seen.add(el);
        new MutationObserver(() => {
          if (this._themeLock) return;
          this._themeLock = 1;
          const t = el.getAttribute('data-theme') || 'light';
          root.querySelectorAll('.pc-root').forEach(o => {
            if (o !== el && o.getAttribute('data-theme') !== t) o.setAttribute('data-theme', t);
          });
          this._themeLock = 0;
        }).observe(el, { attributes: true, attributeFilter: ['data-theme'] });
      });
    };
    attach();
    [400, 1200, 2500].forEach(ms => setTimeout(attach, ms));
  }
  logout() {
    const root = this.rootRef.current;
    if (!root || this._lo) return;
    this._lo = 1;
    const cur = root.querySelector('.pg[data-on="1"]');
    if (cur && cur.dataset.pg !== 'Login') {
      // the workspace settles out, then the login page crossfades in (Login plays its own arrival)
      cur.style.transition = 'opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1)';
      cur.style.transform = 'scale(.988)';
      cur.style.opacity = '0';
      setTimeout(() => {
        this.show('Login');
        setTimeout(() => { cur.style.transition = ''; cur.style.transform = ''; cur.style.opacity = ''; this._lo = 0; }, 320);
      }, 170);
    } else { this.show('Login'); this._lo = 0; }
  }
  show(name, instant) {
    const root = this.rootRef.current;
    if (!root) return;
    this._page = name;
    root.querySelectorAll('[data-pg]').forEach(pg => {
      pg.setAttribute('data-on', pg.dataset.pg === name ? '1' : '0');
    });
    try { document.dispatchEvent(new CustomEvent('kl-page-shown', { detail: { name: name } })); } catch (e) {}
    setTimeout(() => {
      root.querySelectorAll('.pc-root').forEach(r => {
        const el = r.__dcHost || r;
        const k = Object.keys(el).find(k => k.startsWith('__reactFiber$'));
        let f = k && el[k]; while (f && !(f.type && f.type.name === 'StreamableComponent')) f = f && f.return;
        const logic = f && f.stateNode && f.stateNode.logic;
        if (logic && logic._ssbInit) logic._ssbInit();
      });
    }, 140);
    root.querySelectorAll('.tb-tab').forEach(t => {
      const n = (t.textContent || '').trim();
      if (n === 'Build' || n === 'Runs' || n === 'Explore') {
        if (n === name) t.setAttribute('data-active', '1');
        else t.removeAttribute('data-active');
      }
    });
  }
  renderVals() {
    const m = /(\d+)\s*×\s*(\d+)/.exec(this.props.viewport || '');
    const vp = m ? [m[1] + 'px', m[2] + 'px'] : ['100%', '100dvh'];
    return {
      rootRef: this.rootRef,
      vpW: vp[0], vpH: vp[1],
      runState: this._ov.run ?? (this.props.runState ?? 'Running'),
      seedCardStyle: this.props.seedCardStyle ?? 'Compact cards',
      exploreState: this._ov.explore ?? (this.props.exploreState ?? 'Has results'),
      buildState: this._ov.build ?? this._buildOv ?? (this.props.buildState ?? 'Has results'),
      homeState: this.props.homeState ?? 'Has projects',
      libraryLayout: this.props.libraryLayout ?? 'Side by side',
      projectRows: this.props.projectRows ?? 'Preview cards',
      collectionStyle: this.props.collectionStyle ?? 'Cover rows',
      scheme: 'Warm paper',
      netPalette: this.props.networkPalette ?? 'Neutral ink',
      bounce: false,
      connection: this.props.connection ?? 'Online',
      runPhase: 'None',
      apiRetries: this.props.apiRetries ?? false,
      keyProbe: this.props.keyProbe ?? 'All valid',
      pipelineStyle: this.props.pipelineStyle ?? 'Flow chart (6d)',
    };
  }
}
</script>
