      const ws = arr.map(j => { const w = j === not ? 0 : nodes[j].cites + 30; tot += w; return w; });
      let r = rnd() * tot;
      for (let k = 0; k < arr.length; k++) { r -= ws[k]; if (r <= 0) return arr[k]; }
      return arr[arr.length - 1];
    };
    for (let i = 0; i < N - STRAY; i++) {
      const pool = members[cl[i]];
      const m = 2 + Math.floor(rnd() * 2.4);
      for (let k = 0; k < m && pool.length > 1; k++) add(i, wpick(pool, i));
      if (rnd() < .32) {
        const oc = (cl[i] + 1 + Math.floor(rnd() * (K - 1))) % K;
        if (members[oc].length) add(i, wpick(members[oc], i));
      }
    }
    add(N - 6, N - 5); add(N - 4, N - 3); add(N - 3, N - 2);
    return (this._lgGs[seed] = { nodes: nodes, edges: edges });
  }
  applyColor() {
    this.rootRef.current.setAttribute('data-color', this.props.colorScheme ?? 'Warm paper');
  }
  applyState(s) {
    const root = this.rootRef.current;
    root.setAttribute('data-state', s === 'Signed out' ? '' : s);
    if (s === 'Signing in' || s === 'Sign-in failed') {
      const em = this.$('#lg-em'), pw = this.$('#lg-pw');
      if (!em.value) em.value = 'ada@lovelace.edu';
      if (!pw.value) pw.value = 'correct horse battery';
    }
  }
  setErr(field, msg) {
    if (!field) return;
    field.setAttribute('data-invalid', msg ? '1' : '0');
    field.querySelector('.lg-err-t').textContent = msg;
  }
  submit() {
    const root = this.rootRef.current;
    const st = root.getAttribute('data-state');
    if (st === 'Signing in' || st === 'Signed in') return;
    const em = this.$('#lg-em'), pw = this.$('#lg-pw');
    let bad = false;
    const v = em.value.trim();
    if (!v) { this.setErr(em.closest('.lg-field'), 'Enter your email.'); bad = true; }
    else if (!/^\S+@\S+\.\S+$/.test(v)) { this.setErr(em.closest('.lg-field'), 'Enter a valid email address.'); bad = true; }
    if (!pw.value) { this.setErr(pw.closest('.lg-field'), 'Enter your password.'); bad = true; }
    if (bad) return;
    root.setAttribute('data-state', 'Signing in');
    clearTimeout(this._t1); clearTimeout(this._t2); clearTimeout(this._t3); clearTimeout(this._t4);
    this._t1 = setTimeout(() => {
      root.setAttribute('data-state', 'Signed in');
      this._t2 = setTimeout(() => {
        // exit: card settles out, camera dives into the graph, then the shell takes over
        root.setAttribute('data-exit', '1');
        const nv = this._nv;
        if (nv) nv.camTween({ x: nv.cam.x, y: nv.cam.y, k: nv.cam.k * 1.5 }, 620);
        this._t3 = setTimeout(() => {
          root.dispatchEvent(new CustomEvent('kl-login', { bubbles: true, composed: true }));
          this._t4 = setTimeout(() => {
            root.removeAttribute('data-exit');
            root.setAttribute('data-state', '');
            pw.value = '';
            if (this._nv) { this._nv.fit(false); this._nvBB = null; this._nvCalm = 0; this._nv.wake(); }
          }, 800);
        }, 430);
      }, 750);
    }, 1300);
  }
  sso(b) {
    if (b.dataset.busy) return;
    b.dataset.busy = '1';
    const orig = b.innerHTML;
    b.style.minWidth = b.offsetWidth + 'px';
    b.innerHTML = '<span class="lg-spin" style="margin-right:8px;"></span>Redirecting…';
    setTimeout(() => { b.innerHTML = orig; delete b.dataset.busy; b.style.minWidth = ''; }, 1400);
  }
  renderVals() {
    return { rootRef: this.rootRef };
  }
}
</script>
